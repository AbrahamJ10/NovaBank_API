name: Backup diario de la base de datos

on:
  schedule:
    # 08:00 UTC = 03:00 hora Perú (UTC-5), fuera de horas de uso
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Neon corre PostgreSQL 18, y pg_dump se niega a volcar un servidor de
      # versión mayor a la suya — Ubuntu solo trae hasta la 16 por defecto,
      # así que instalamos la 18 desde el repositorio oficial de PGDG.
      - name: Instalar cliente de PostgreSQL 18
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Generar dump comprimido de Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          FILENAME="novabank-$(date -u +%Y-%m-%d).sql.gz"
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" | gzip > "$FILENAME"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

      - name: Subir el backup a Backblaze B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          echo "Archivo local a subir:"
          ls -la "$FILENAME"
          aws s3 cp "$FILENAME" "s3://novabank-backups-abraham/$FILENAME" \
            --endpoint-url https://s3.us-east-005.backblazeb2.com \
            --region us-east-005 \
            --debug 2>&1 | tail -80
          echo "--- Contenido del bucket después de subir ---"
          aws s3 ls "s3://novabank-backups-abraham/" \
            --endpoint-url https://s3.us-east-005.backblazeb2.com \
            --region us-east-005
