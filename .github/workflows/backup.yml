name: Backup diario de la base de datos

on:
  schedule:
    # 08:00 UTC = 03:00 hora Perú (UTC-5), fuera de horas de uso
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Neon corre PostgreSQL 18, y pg_dump se niega a volcar un servidor de
      # versión mayor a la suya — Ubuntu solo trae hasta la 16 por defecto,
      # así que instalamos la 18 desde el repositorio oficial de PGDG.
      - name: Instalar cliente de PostgreSQL 18
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Generar dump comprimido de Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          FILENAME="novabank-$(date -u +%Y-%m-%d).sql.gz"
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" | gzip > "$FILENAME"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

      # Guardamos el backup como un commit en una rama dedicada de este
      # mismo repo — no requiere ninguna cuenta ni credencial nueva, solo
      # el token que GitHub ya le da automáticamente a cada Action.
      - name: Subir el backup a la rama "backups" de este repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_FILE="$GITHUB_WORKSPACE/$FILENAME"

          mkdir backups-checkout
          cd backups-checkout
          git init -q
          git config user.name "novabank-backup-bot"
          git config user.email "actions@github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          if git fetch -q origin backups; then
            git checkout -q backups
          else
            git checkout -q --orphan backups
          fi

          mkdir -p data
          cp "$SOURCE_FILE" "data/$FILENAME"
          git add "data/$FILENAME"
          git commit -q -m "Backup $(date -u +%Y-%m-%d)"
          git push -q origin backups
